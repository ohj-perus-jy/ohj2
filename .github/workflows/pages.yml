# Julkaisee GitHub Pagesiin kaksi Zensical-sivustoa samasta artefaktista:
#
#   /      `main`-haarasta (tuotanto)
#   /dev/  `dev`-haarasta (esikatselu)
#
# Molemmat rakennetaan jokaisella pushilla kumpaan tahansa haaraan, koska
# Pages-sivusto on yksi kokonaisuus: osittainen julkaisu pyyhkisi toisen.
# Tämän tiedoston on oltava sama `main`issa ja `dev`:ssä; `main`-push ajaa
# `main`in version. mdBook-julkaisu päättyi ja sen tiedostot poistettiin
# 2026-09-20.
name: Deploy site to Pages

on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # ajon artefaktien poisto

# Yksi julkaisu kerrallaan; jonossa olevia ei peruta, jotta tuotantojulkaisu
# valmistuu aina.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Sama rakennus kummallekin haaralle. convert.py tarvitsee vain
  # standardikirjaston; kaaviot (cache/mermaid/, cache/svgbob/) ovat
  # versionhallinnassa, joten Nodea tai svgbobia ei tarvita.
  # --strict kaataa ajon, jos jokin kaavio puuttuu välimuistista: ilman sitä
  # sivu julkaistaisiin kaavio koodilohkona.
  # Ääneenluvun leikkeet ovat erillisessä repossa (kirja.toml: [puhe] repo),
  # jonka tyokalut/puhe.py täyttää; --strict kaatuu myös, jos se puuttuu.
  zensical:
    strategy:
      matrix:
        include:
          - ref: main
            artifact: site
          - ref: dev
            artifact: site-dev
    name: zensical (${{ matrix.ref }})
    runs-on: vellu2-vps
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          # Työkalut: zensical/tyokalut (kirjatyokalut-repo).
          submodules: true
      - uses: actions/checkout@v7
        with:
          repository: ohj-perus-jy/ohj2-puhe
          path: zensical/puhe
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: zensical/tyokalut/requirements.txt
      - name: Install Zensical
        run: pip install -r zensical/tyokalut/requirements.txt
      - name: Convert and build
        working-directory: zensical
        run: |
          python3 tyokalut/convert.py --strict
          zensical build
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: zensical/site
          retention-days: 5

  deploy:
    needs: zensical
    runs-on: vellu2-vps
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: _site
      - uses: actions/download-artifact@v8
        with:
          name: site-dev
          path: _site/dev
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
      # Artefakteja tarvitaan vain tässä jobissa. Poistetaan heti, jotta ne eivät
      # kerrytä orgin tallennuskiintiötä (500 MB/kk Free-orgilla, tuntikertymä).
      - name: Poista ajon artefaktit
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: context.runId, per_page: 100 });
            for (const a of data.artifacts) {
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
              core.info(`poistettu ${a.name} (${Math.round(a.size_in_bytes / 1048576)} MB)`);
            }
