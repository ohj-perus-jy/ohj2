# Julkaisee GitHub Pagesiin kaksi sivustoa samasta artefaktista:
#
#   /      mdBook `main`-haarasta (kuten ennenkin)
#   /dev/  Zensical `dev`-haarasta
#
# Molemmat rakennetaan jokaisella pushilla kumpaan tahansa haaraan, koska
# Pages-sivusto on yksi kokonaisuus: osittainen julkaisu pyyhkisi toisen.
# Tämän tiedoston on oltava sama `main`issa ja `dev`:ssä; `main`-push ajaa
# `main`in version. Ks. zensical/KAYTTOONOTTO.md, vaihe 2.
name: Deploy site to Pages

on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Yksi julkaisu kerrallaan; jonossa olevia ei perutaan, jotta tuotantojulkaisu
# valmistuu aina.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # mdBook `main`ista sivuston juureen.
  mdbook:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ohj-perus-jy/ohj-mdbook-tooling:runner-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build with mdBook
        run: mdbook build
      - uses: actions/upload-artifact@v4
        with:
          name: mdbook
          path: book

  # Pelkkä tarkistus `dev`-pushissa: `dev` ei saa rikkoa mdBookia, koska sen
  # on pysyttävä mergettävänä `main`iin. Ei estä julkaisua, mutta värjää ajon
  # punaiseksi.
  mdbook-dev-check:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ohj-perus-jy/ohj-mdbook-tooling:runner-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Check that dev still builds with mdBook
        run: mdbook build

  # Zensical `dev`:stä alipolkuun /dev/. convert.py tarvitsee vain
  # standardikirjaston; kaaviot (cache/svgbob/, assets/plantuml/) ovat
  # versionhallinnassa, joten svgbobia tai PlantUML-palvelinta ei tarvita.
  zensical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: zensical/requirements.txt
      - name: Install Zensical
        run: pip install -r zensical/requirements.txt
      - name: Convert and build
        working-directory: zensical
        run: |
          python3 convert.py
          zensical build
      - uses: actions/upload-artifact@v4
        with:
          name: zensical
          path: zensical/site

  deploy:
    needs: [mdbook, zensical]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mdbook
          path: _site
      - uses: actions/download-artifact@v4
        with:
          name: zensical
          path: _site/dev
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
