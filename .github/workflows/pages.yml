# Julkaisee GitHub Pagesiin kaksi Zensical-sivustoa yhtenä kokonaisuutena:
#
#   /      `main`-haarasta (tuotanto)
#   /dev/  `dev`-haarasta (esikatselu)
#
# Molemmat rakennetaan jokaisella pushilla kumpaan tahansa haaraan, koska
# Pages-sivusto on yksi kokonaisuus: osittainen julkaisu pyyhkisi toisen.
# Kaikki tapahtuu yhdessä jobissa, jotta buildin tulosta ei tarvitse siirtää
# jobien välillä upload-artifactilla: välivaiheen artefaktit kuluttivat orgin
# artefaktikiintiön (90 päivän säilytys × 2 × ~130 MB per push). Ainoa
# artefakti on Pages-paketti, joka vanhenee vuorokaudessa.
# Tämän tiedoston on oltava sama `main`issa ja `dev`:ssä; `main`-push ajaa
# `main`in version. mdBook-julkaisu päättyi ja sen tiedostot poistettiin
# 2026-09-20.
name: Deploy site to Pages

on:
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Yksi julkaisu kerrallaan; jonossa olevia ei peruta, jotta tuotantojulkaisu
# valmistuu aina.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # convert.py tarvitsee vain standardikirjaston; kaaviot (cache/mermaid/,
  # cache/svgbob/) ovat versionhallinnassa, joten Nodea tai svgbobia ei tarvita.
  # --strict kaataa ajon, jos jokin kaavio puuttuu välimuistista: ilman sitä
  # sivu julkaistaisiin kaavio koodilohkona.
  # Ääneenluvun leikkeet ovat erillisessä repossa (kirja.toml: [puhe] repo),
  # jonka tyokalut/puhe.py täyttää; --strict kaatuu myös, jos se puuttuu.
  deploy:
    runs-on: vellu2-vps
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main
          # Työkalut: zensical/tyokalut (kirjatyokalut-repo).
          submodules: true
      - uses: actions/checkout@v7
        with:
          ref: dev
          path: dev
          submodules: true
      - uses: actions/checkout@v7
        with:
          repository: ohj-perus-jy/ohj2-puhe
          path: main/zensical/puhe
          fetch-depth: 1
      - name: Puheleikkeet myös dev-haaralle
        run: cp -a main/zensical/puhe dev/zensical/puhe
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            main/zensical/tyokalut/requirements.txt
            dev/zensical/tyokalut/requirements.txt
      - name: Install Zensical
        run: |
          pip install -r main/zensical/tyokalut/requirements.txt
          pip install -r dev/zensical/tyokalut/requirements.txt
      - name: Convert and build (main)
        working-directory: main/zensical
        run: |
          python3 tyokalut/convert.py --strict
          zensical build
      - name: Convert and build (dev)
        working-directory: dev/zensical
        run: |
          python3 tyokalut/convert.py --strict
          zensical build
      - name: Kokoa sivusto
        run: |
          mkdir -p _site/dev
          cp -a main/zensical/site/. _site/
          cp -a dev/zensical/site/. _site/dev/
          du -sh _site _site/dev
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
