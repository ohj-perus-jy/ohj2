# Barebones-lähtötilanne: Zensicalin oletusteema sellaisenaan.
#
# Tässä tiedostossa on tarkoituksella VAIN se, mitä ilman sivustoa ei ole
# olemassa: nimi, teema ja navigaatio. Jokainen rivi, joka tänne myöhemmin
# lisätään, pitää pystyä perustelemaan jollakin mdBookin ominaisuudella,
# jota oikeasti tarvitaan. Ks. README.md:n tarkistuslista.
INHERIT: nav.yml

site_name: Ohjelmointi 2
docs_dir: docs
site_dir: site

theme:
  name: material
  language: fi
  features:
    # mdBookissa osan otsikko on itse linkki osan etusivulle, ja nuoli avaa
    # alikohdat. Ilman tätä etusivu toistuisi vielä ensimmäisenä lapsena.
    - navigation.indexes

  # book.toml: default-theme = "jyu-light", preferred-dark-theme = "jyu-dark".
  # media-ehto tekee saman: teema seuraa käyttöjärjestelmää, ja vaihdin
  # ohittaa sen. Värit ovat toistaiseksi Materialin omat, ei JYU-palettia.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Vaihda tummaan teemaan
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Vaihda vaaleaan teemaan

extra_css:
  - assets/css/layout.css
