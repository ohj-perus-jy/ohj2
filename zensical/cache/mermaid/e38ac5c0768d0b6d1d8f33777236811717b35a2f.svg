  <text x="140.39999999999998" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="var(--_text)" dy="4.55">Saadettava</text>
  <line x1="40" y1="108" x2="240.79999999999998" y2="108" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <line x1="40" y1="116" x2="240.79999999999998" y2="116" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="48" y="130" class="mono" dy="0.35em" font-size="11" font-weight="400"><tspan fill="var(--_text-faint)">+ </tspan><tspan fill="var(--_text-sec)">asetaArvo(arvo: int)</tspan><tspan fill="var(--_text-faint)">: </tspan><tspan fill="var(--_text-muted)">void</tspan></text>
</g>
<g class="class-node" data-id="Laite" data-label="Laite" data-annotation="abstract">
