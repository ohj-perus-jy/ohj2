  <circle cx="366" cy="287" r="35" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="366" y="287" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">9</text>
</g>
</svg>