  <circle cx="123.24999999999999" cy="169" r="35" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="123.24999999999999" y="169" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">8</text>
</g>
