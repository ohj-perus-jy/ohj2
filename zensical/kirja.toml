# Kirjan asetukset työkaluille (tyokalut/convert.py); avaimet: tyokalut/README.md.
nimi = "ohj2"

ei_sivuja = ["*/huomiot.md", "*/jemma.md"]

# Kuvan klikkaus avaa sen täysikokoisena (kokeilu, ks. tyokalut/README.md).
kuvasuurennus = true

# Sisällytetyn tehtävänannon kuvapolku ratkeaa sisällyttävän sivun mukaan ja
# osuu ohi. Sama virhe on mdBookin käännöksessä: korjataan ../src:ssä.
[testit]
rikkinaiset_kuvat = ["osa4/images/adventure.png"]

[puhe]
sivut = [
    "osa1/02-muuttujat-ja-tietotyypit.md",
    "osa2/*",
    "osa5/*",
]
repo = "https://github.com/ohj-perus-jy/ohj2-puhe.git"